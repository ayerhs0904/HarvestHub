server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/harvesthub}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:harvestHubSuperSecretSecretKey2026AgriculturalPlatformKeyMustBeAtLeast256BitsLong!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.harvesthub: INFO
